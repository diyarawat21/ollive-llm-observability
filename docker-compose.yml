version: "3.9"

services:

  backend:
    build: ./backend
    container_name: ollive_backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  frontend:
    build: ./frontend
    container_name: ollive_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: npm run dev -- --host
